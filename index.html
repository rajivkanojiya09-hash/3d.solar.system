<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>3D Interactive Solar System</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}
#title{position:fixed;top:10px;left:10px;z-index:20;color:#fff;background:rgba(0,0,0,.75);padding:12px 15px;border-radius:12px}
#title h2{margin:0;font-size:18px}#title p{margin:5px 0 0;font-size:11px;opacity:.8}
#planetMenu{position:fixed;left:15px;bottom:20px;z-index:30;width:155px;max-height:65vh;overflow-y:auto;padding:12px;color:#fff;background:rgba(0,0,0,.82);border-radius:15px}
.menuTitle{text-align:center;font-size:13px;font-weight:bold;margin-bottom:8px}
#planetMenu button{width:100%;height:36px;margin:3px 0;border:0;border-radius:8px;background:#202020;color:#fff;font-size:13px;font-weight:bold}
#planetMenu button:active{transform:scale(.96)}
#controls{position:fixed;right:15px;bottom:20px;z-index:30;width:185px;padding:15px;color:#fff;background:rgba(0,0,0,.82);border-radius:15px}
#zoomButtons{display:flex;justify-content:center;margin-bottom:12px}#controls button{width:50px;height:42px;margin:3px;border:0;border-radius:10px;background:#252525;color:#fff;font-size:22px;font-weight:bold}
#speed{width:100%}.speedLabel{font-size:12px;display:block}.speedValue{text-align:center;margin-top:5px;font-weight:bold}
#selectedInfo{position:fixed;top:85px;left:50%;transform:translateX(-50%);z-index:25;color:#fff;background:rgba(0,0,0,.75);padding:8px 15px;border-radius:20px;font-size:13px;opacity:0;transition:.3s}
#selectedInfo.show{opacity:1}
@media(max-width:600px){#title{padding:9px 11px}#title h2{font-size:15px}#title p{font-size:9px}#planetMenu{left:8px;bottom:8px;width:130px;padding:8px}#planetMenu button{height:32px;font-size:11px}#controls{right:8px;bottom:8px;width:145px;padding:10px}#controls button{width:42px;height:38px;font-size:20px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<div id="title"><h2>🌌 3D SOLAR SYSTEM</h2><p>Drag to rotate • Select a planet • Control speed</p></div>
<div id="selectedInfo">🌌 Full Solar System</div>
<div id="planetMenu">
<div class="menuTitle">🪐 SELECT PLANET</div>
<button data-planet="Mercury">☿ Mercury</button>
<button data-planet="Venus">♀ Venus</button>
<button data-planet="Earth">🌍 Earth</button>
<button data-planet="Mars">🔴 Mars</button>
<button data-planet="Jupiter">🟠 Jupiter</button>
<button data-planet="Saturn">🪐 Saturn</button>
<button data-planet="Uranus">🔵 Uranus</button>
<button data-planet="Neptune">🔵 Neptune</button>
<button id="systemView">🌌 Solar System</button>
</div>
<div id="controls">
<div id="zoomButtons"><button id="zoomIn">+</button><button id="zoomOut">−</button></div>
<label class="speedLabel">🚀 Planet Speed</label>
<input type="range" id="speed" min="0" max="5" step="0.1" value="1">
<div class="speedValue" id="speedValue">1.0×</div>
</div>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,5000);let cameraDistance=450;camera.position.set(0,180,cameraDistance);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const sunLight=new THREE.PointLight(0xffffff,8,2000);scene.add(sunLight);scene.add(new THREE.AmbientLight(0xffffff,1.5));
const starGeometry=new THREE.BufferGeometry(),starPositions=new Float32Array(30000);
for(let i=0;i<30000;i+=3){starPositions[i]=(Math.random()-.5)*3000;starPositions[i+1]=(Math.random()-.5)*3000;starPositions[i+2]=(Math.random()-.5)*3000}
starGeometry.setAttribute("position",new THREE.BufferAttribute(starPositions,3));scene.add(new THREE.Points(starGeometry,new THREE.PointsMaterial({color:0xffffff,size:2})));
function createLabel(text){const c=document.createElement("canvas");c.width=512;c.height=128;const x=c.getContext("2d");x.fillStyle="white";x.font="bold 42px Arial";x.textAlign="center";x.fillText(text,256,80);const t=new THREE.CanvasTexture(c),s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));s.scale.set(25,6,1);return s}
const sun=new THREE.Mesh(new THREE.SphereGeometry(24,48,48),new THREE.MeshBasicMaterial({color:0xffff00}));scene.add(sun);
scene.add(new THREE.Mesh(new THREE.SphereGeometry(32,32,32),new THREE.MeshBasicMaterial({color:0xff8800,transparent:true,opacity:.25})));sunLight.position.set(0,0,0);
const planets=[],planetMap={};
function createPlanet(name,size,distance,color,speed){
const orbit=new THREE.Object3D();scene.add(orbit);const points=[];
for(let i=0;i<=128;i++){const a=i/128*Math.PI*2;points.push(new THREE.Vector3(Math.cos(a)*distance,0,Math.sin(a)*distance))}
scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineBasicMaterial({color:0x555555})));
const mesh=new THREE.Mesh(new THREE.SphereGeometry(size,48,48),new THREE.MeshStandardMaterial({color,roughness:.65,metalness:.05}));mesh.position.x=distance;orbit.add(mesh);
const l=createLabel(name);l.position.y=size+8;mesh.add(l);const data={name,orbit,planet:mesh,speed,size};planets.push(data);planetMap[name]=data}
createPlanet("Mercury",3,40,0xaaaaaa,.035);createPlanet("Venus",5,60,0xffb84d,.027);createPlanet("Earth",5.5,82,0x0088ff,.022);createPlanet("Mars",4,105,0xff3311,.018);createPlanet("Jupiter",13,140,0xff9966,.009);createPlanet("Saturn",11,185,0xffcc66,.007);createPlanet("Uranus",7,230,0x00ffff,.005);createPlanet("Neptune",7,275,0x0044ff,.003);
const saturn=planetMap.Saturn.planet,ring=new THREE.Mesh(new THREE.RingGeometry(14,23,96),new THREE.MeshBasicMaterial({color:0xffdd99,side:THREE.DoubleSide}));ring.rotation.x=Math.PI/2;saturn.add(ring);
const earth=planetMap.Earth.planet,moonOrbit=new THREE.Object3D();earth.add(moonOrbit);const moon=new THREE.Mesh(new THREE.SphereGeometry(1.5,24,24),new THREE.MeshStandardMaterial({color:0xcccccc}));moon.position.x=10;moonOrbit.add(moon);const ml=createLabel("Moon");ml.scale.set(12,3,1);ml.position.y=3;moon.add(ml);
let speedMultiplier=1;document.getElementById("speed").addEventListener("input",e=>{speedMultiplier=parseFloat(e.target.value);document.getElementById("speedValue").textContent=speedMultiplier.toFixed(1)+"×"});
document.getElementById("zoomIn").addEventListener("click",()=>cameraDistance=Math.max(100,cameraDistance-40));document.getElementById("zoomOut").addEventListener("click",()=>cameraDistance=Math.min(1000,cameraDistance+40));
let selectedPlanet=null,cameraOffset=new THREE.Vector3(0,10,35);
function selectPlanet(name){const data=planetMap[name];if(!data)return;selectedPlanet=data;document.getElementById("selectedInfo").textContent="🚀 Viewing "+name;document.getElementById("selectedInfo").classList.add("show");cameraOffset.set(0,data.size*2,Math.max(data.size*7,25))}
function showSolarSystem(){selectedPlanet=null;cameraDistance=450;document.getElementById("selectedInfo").classList.remove("show")}
document.querySelectorAll("#planetMenu button[data-planet]").forEach(b=>b.addEventListener("click",()=>selectPlanet(b.dataset.planet)));document.getElementById("systemView").addEventListener("click",showSolarSystem);
let dragging=false,lastX=0,lastY=0,rotX=.35,rotY=0;
renderer.domElement.addEventListener("pointerdown",e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener("pointerup",()=>dragging=false);renderer.domElement.addEventListener("pointercancel",()=>dragging=false);
renderer.domElement.addEventListener("pointermove",e=>{if(!dragging)return;rotY+=(e.clientX-lastX)*.006;rotX+=(e.clientY-lastY)*.006;rotX=Math.max(-.8,Math.min(.8,rotX));lastX=e.clientX;lastY=e.clientY});
function animate(){requestAnimationFrame(animate);planets.forEach(p=>{p.orbit.rotation.y+=p.speed*speedMultiplier;p.planet.rotation.y+=.01*speedMultiplier});moonOrbit.rotation.y+=.04*speedMultiplier;sun.rotation.y+=.003*speedMultiplier;stars.rotation.y+=.00002*speedMultiplier;
if(selectedPlanet){const pos=new THREE.Vector3();selectedPlanet.planet.getWorldPosition(pos);camera.position.lerp(pos.clone().add(cameraOffset),.07);camera.lookAt(pos)}
else{camera.position.x=Math.sin(rotY)*cameraDistance;camera.position.z=Math.cos(rotY)*cameraDistance;camera.position.y=180+rotX*120;camera.lookAt(0,0,0)}
renderer.render(scene,camera)}
animate();
window.addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
